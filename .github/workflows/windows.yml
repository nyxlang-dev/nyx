                # "hang" se mide por el WATCHDOG interno (rc=99) -- diseño
                # original de rev2, restaurado: el VEH (global_veh) ya NO
                # mata el proceso en el primer AV (eso rompia el mecanismo:
                # s0c/s2raw/s2default EXISTEN para que bdwgc reintente sobre
                # la misma pagina mala PARA SIEMPRE, alloc.c:875 -- interceptar
                # y salir en el primer first-chance AV los hacia terminar en
                # rc=97 en vez de colgar, tapando exactamente lo que estos
                # modos existen para probar). rc=97 aca significaria que el
                # filtro UNHANDLED disparo -- osea que ni siquiera bdwgc pudo
                # manejar el AV esperado -- una señal real, no una confirmacion:
                # NO cuenta como pass. rc=124 (timeout EXTERNO) tampoco cuenta:
                # significa que ni el watchdog ni nada mas disparo.
                if [ "$rc" -eq 99 ]; then
                  pass=$((pass + 1))
                elif [ "$rc" -eq 124 ]; then
                  echo "  [$mode] run $i: timeout EXTERNO (124), no el watchdog -- sospechoso, no cuenta"
                fi
              fi
            done
          }

          echo "### s0  x3  (sin fibers, sin roots)                    -> se espera OK"
          run_mode s0 15 3 ok; PASS_S0=$pass
          echo "### s0b x3  (fibers, SIN GC_add_roots del stack)       -> se espera OK"
          run_mode s0b 15 3 ok; PASS_S0B=$pass
          echo "### s0c x3  (sin fibers, root RAW sobre MEM_RESERVE)   -> se espera CUELGUE (rc!=0 via watchdog)"
          run_mode s0c 15 3 hang; PASS_S0C=$pass
          echo "### s2raw x10 (fiber CreateFiberEx + root RAW/nominal) -> se espera CUELGUE; tambien es la mitad 'raw' de R2"
          run_mode s2raw 15 10 hang; PASS_S2RAW=$pass

          echo ""
          echo "================================================================"
          echo "R0 (arm64): s0=$PASS_S0/3(ok) s0b=$PASS_S0B/3(ok) s0c=$PASS_S0C/3(hang) s2raw=$PASS_S2RAW/10(hang)"
          echo "================================================================"

          if [ "$PASS_S0B" -ne 3 ]; then
            echo "FASE A (arm64): s0b (fibers SIN roots) NO devolvio OK en las 3 corridas."
            echo "  El ROOT CAUSE de rev2 es FALSO en esta arquitectura. Ver rev2 §4,"
            echo "  Opcion F. NO seguir a Fase B — evidencia para BLOCKED/hallazgo ABI."
            exit 1
          fi
          if [ "$PASS_S0" -ne 3 ] || [ "$PASS_S0C" -ne 3 ] || [ "$PASS_S2RAW" -ne 10 ]; then
            echo "FASE A (arm64): la matriz 2x2 no cerro limpio (ver conteos arriba)."
            exit 1
          fi
          echo "FASE A OK (arm64): root-cause de rev2 CONFIRMADO — procediendo a Fase B."

      - name: Fase B — matriz S1-S6 completa con el fix (rango medido + guardia)
        shell: bash
        run: |
          set -u
          cd bin

          run_mode() {
            mode="$1"; tmo="$2"; runs="$3"; expect="$4"
            pass=0
            for i in $(seq 1 "$runs"); do
              logf="out_${mode}_${i}.log"
              # SIN subshell alrededor de `timeout`: la forma anterior
              # ( timeout ... ) > "$logf" 2>&1 metia una capa extra de
              # proceso (subshell) entre bash y spike.exe. Confirmado en el
              # run 33064189783 (coordinador + revision propia): 3 de las 4
              # corridas fallidas de S1/S3 en ARM64 capturaron CERO bytes en
              # su out_*.log pese a que spike.exe SI llega a escribir varias
              # lineas antes de morir (visto en x64, run 6 de s3, que
              # alcanzo a volcar una linea VEH completa). Redirigir DIRECTO
              # sobre `timeout` (sin parentesis) es la forma estandar y
              # elimina esa capa como sospechoso.
              # El `if` sigue siendo obligatorio (NO cosmetico, misma
              # trampa que w2-subset ya documenta en este archivo): shell:
              # bash corre con `-e`, y un `cmd; rc=$?` pelado mata el step
              # en la primera corrida que salga != 0 -- exactamente el caso
              # que esta matriz existe para reportar (los modos "hang"
              # SIEMPRE salen != 0, y son la mayoria de las corridas).
              if timeout "$tmo" ./spike.exe "$mode" > "$logf" 2>&1; then
                rc=0
              else
                rc=$?
              fi
              echo "  [$mode] run $i rc=$rc"
              cat "$logf"
              # rc=97: el VEH del binario detecto un EXCEPTION_ACCESS_VIOLATION
              # real, volco el diagnostico crudo (_write, sin stdio -- ver
              # global_veh) y salio el solo. Distinto de rc=99 (watchdog: el
              # proceso NUNCA volvio) y de cualquier `return 1` interno.
              # Pedido explicito de diagnostico (2026-08-27): rotular esta
              # corrida aparte y volcar su salida completa de nuevo, resaltada,
              # sea cual sea el modo.
              if [ "$rc" -eq 97 ]; then
                echo "  ==== AV CAPTURADO POR VEH: [$mode] run $i rc=97 -- salida completa de $logf ===="
                cat "$logf"
                echo "  ==== fin del volcado VEH de [$mode] run $i ===="
              fi
              if [ "$expect" = "ok" ]; then
                if [ "$rc" -eq 0 ]; then
                  pass=$((pass + 1))
                elif [ "$rc" -ne 97 ]; then
                  # rc=97 ya se etiqueto y volco arriba -- este bloque es
                  # para cualquier OTRO fallo inesperado (no duplicar el
                  # volcado de arriba).
                  echo "  ==== FALLO INESPERADO: [$mode] run $i rc=$rc -- tail -40 de $logf ===="
                  tail -40 "$logf"
                  echo "  ==== fin del detalle de [$mode] run $i ===="
                fi
              else
                # "hang" se mide por el WATCHDOG interno (rc=99) -- diseño
                # original de rev2, restaurado: el VEH (global_veh) ya NO
                # mata el proceso en el primer AV (eso rompia el mecanismo:
                # s0c/s2raw/s2default EXISTEN para que bdwgc reintente sobre
                # la misma pagina mala PARA SIEMPRE, alloc.c:875 -- interceptar
                # y salir en el primer first-chance AV los hacia terminar en
                # rc=97 en vez de colgar, tapando exactamente lo que estos
                # modos existen para probar). rc=97 aca significaria que el
                # filtro UNHANDLED disparo -- osea que ni siquiera bdwgc pudo
                # manejar el AV esperado -- una señal real, no una confirmacion:
                # NO cuenta como pass. rc=124 (timeout EXTERNO) tampoco cuenta:
                # significa que ni el watchdog ni nada mas disparo.
                if [ "$rc" -eq 99 ]; then
                  pass=$((pass + 1))
                elif [ "$rc" -eq 124 ]; then
                  echo "  [$mode] run $i: timeout EXTERNO (124), no el watchdog -- sospechoso, no cuenta"
                fi
              fi
            done
          }

          echo "### s2measured x10 (fiber CreateFiberEx + rango MEDIDO/walk)  -> OK"
          run_mode s2measured 15 10 ok; PASS_S2MEASURED=$pass

          echo "### s2default x10 (CreateFiber default + root RAW)  -> se espera CUELGUE"
          run_mode s2default 15 10 hang; PASS_S2D=$pass

          echo "### s2ex x10 (CreateFiberEx commit==reserve + rango MEDIDO)  -> OK"
          run_mode s2ex 15 10 ok; PASS_S2EX=$pass

          echo "### s5 x1"
          run_mode s5 15 1 ok; PASS_S5=$pass

          echo "### s1 x20 (carga completa, root MEDIDO + guardia)"
          run_mode s1 30 20 ok; PASS_S1=$pass
          WARN_ZERO_S1=0
          for i in $(seq 1 20); do
            wc=$(grep -o 'warn_count=[0-9]*' "out_s1_$i.log" | head -1 | cut -d= -f2) || true
            wc=${wc:-0}
            [ "$wc" -eq 0 ] && WARN_ZERO_S1=$((WARN_ZERO_S1 + 1))
          done

          echo "### s3 x50 (diagnostico 2026-08-27, ruling autor diseno: mas masa para que"
          echo "### el 1/20 caiga -- gate de commit + gcollect inmediato + volcado de canario)"
          run_mode s3 30 50 ok; PASS_S3=$pass
          CORRUPT_NONZERO_S3=0
          for i in $(seq 1 50); do
            cc=$(grep -o 'corrupt_count=[0-9]*' "out_s3_$i.log" | head -1 | cut -d= -f2) || true
            cc=${cc:-1}
            [ "$cc" -ne 0 ] && CORRUPT_NONZERO_S3=$((CORRUPT_NONZERO_S3 + 1))
          done
          echo ""
          echo "---- VOLCADO S3-CORRUPT (si aparece, es LA linea que decide el mecanismo) ----"
          grep -h "S3-CORRUPT" out_s3_*.log || echo "(ningun S3-CORRUPT en las 50 corridas)"
          echo "-------------------------------------------------------------------------------"

          echo "### s4 x1 (techo MAX_ROOT_SETS subido a 20000 + costo O(n^2))"
          run_mode s4 30 1 ok; PASS_S4=$pass
          S4_N=$(grep -o 'N=[0-9]*' out_s4_1.log | head -1 | cut -d= -f2) || true
          S4_VERSION=$(grep -o 'GC_get_version=0x[0-9a-fA-F]*' out_s4_1.log | head -1 | cut -d= -f2) || true

          echo ""
          echo "================================================================"
          echo "R2 (arm64) s2raw(FaseA)=10/10(hang esperado) s2measured=$PASS_S2MEASURED/10(ok esperado)"
          echo "S6 (paridad ARM64) — S5_RESULT: $PASS_S5/1 exit0"
          echo "S6 (paridad ARM64) — S1_RESULT: $PASS_S1/20 exit0 ; warn_count==0 en $WARN_ZERO_S1 corridas (debe ser 0)"
          echo "S6 (paridad ARM64) — S2DEFAULT_RESULT: $PASS_S2D/10 (rc!=0 esperado)"
          echo "S6 (paridad ARM64) — S2EX_RESULT: $PASS_S2EX/10 exit0"
          echo "S6 (paridad ARM64) — S3_RESULT: $PASS_S3/50 exit0 ; corrupt_count!=0 en $CORRUPT_NONZERO_S3 corridas (debe ser 0)"
          echo "S6 (paridad ARM64) — S4_RESULT: N=${S4_N:-desconocido} GC_get_version=${S4_VERSION:-desconocido}"
          echo "================================================================"

          FAIL=0
          [ "$PASS_S2MEASURED" -eq 10 ] || { echo "FALLO R2 s2measured (arm64): no dio 10/10 exit0"; FAIL=1; }
          [ "$PASS_S5" -eq 1 ] || { echo "FALLO S5 (arm64)"; FAIL=1; }
          [ "$PASS_S1" -eq 20 ] || { echo "FALLO S1 (arm64): no dio 20/20 exit0"; FAIL=1; }
          [ "$WARN_ZERO_S1" -eq 0 ] || { echo "FALLO S1 (arm64): $WARN_ZERO_S1 corridas con warn_count==0"; FAIL=1; }
          [ "$PASS_S2D" -eq 10 ] || { echo "FALLO S2default (arm64): no dio 10/10 con rc!=0"; FAIL=1; }
          [ "$PASS_S2EX" -eq 10 ] || { echo "FALLO S2ex (arm64): no dio 10/10 exit0"; FAIL=1; }
          [ "$PASS_S3" -eq 50 ] || { echo "FALLO S3 (arm64): no dio 50/50 exit0"; FAIL=1; }
          [ "$CORRUPT_NONZERO_S3" -eq 0 ] || { echo "FALLO S3 (arm64): $CORRUPT_NONZERO_S3 corridas con canarios corruptos"; FAIL=1; }
          [ "$PASS_S4" -eq 1 ] || { echo "FALLO S4 (arm64): no corrio limpio"; FAIL=1; }

          if [ "$FAIL" -ne 0 ]; then
            echo "w3-spike-arm64: divergencia en ARM64 — HALLAZGO DE ABI, no una linea a borrar"
            echo "  (misma regla que el manifiesto de W2: si x64 dio verde y esto da rojo, reportar, no tapar)"
            exit 1
          fi
          echo "w3-spike (arm64): Fase A + Fase B verificadas — paridad con x64 confirmada"
