name: Nyx CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  #  Linux (Ubuntu)
  # ─────────────────────────────────────────────
  test-linux:
    name: Test (Linux / Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgc-dev libssl-dev

      - name: Build bootstrap compiler
        run: make bootstrap

      - name: Run regression tests (217/217 ARM64, 218/218 x86_64)
        run: make test

      - name: Run advanced tests (30/30)
        run: bash tests/advanced/run_advanced_tests.sh

      - name: Run stdlib tests
        run: make test-stdlib

  # ─────────────────────────────────────────────
  #  macOS — DESACTIVADO 2026-06-11 (decisión de Ottavio: no es prioridad).
  #  "Build bootstrap compiler" falla en macos-latest desde junio 2026 con el
  #  mismo código que pasa en Linux — sospecha: cambio del runner image
  #  (patrón ya visto en abril: brew paths + ucontext_t, fix c83781f).
  #  Para reactivar: descomentar el job y diagnosticar con el log del run
  #  (requiere gh CLI autenticado o la UI de Actions). Entrada en TASKS.md.
