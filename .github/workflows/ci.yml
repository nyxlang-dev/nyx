# Sin billing en GitHub Actions desde 2026-08 (cuenta de Ottavio); este
# workflow es el gate cuando vuelva.
name: Nyx CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  #  Linux (Ubuntu)
  # ─────────────────────────────────────────────
  test-linux:
    name: Test (Linux / Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgc-dev libssl-dev

      - name: Build bootstrap compiler
        run: make bootstrap

      - name: Run regression tests
        run: make test

      - name: Run advanced tests
        run: bash tests/advanced/run_advanced_tests.sh

      - name: Run stdlib tests
        run: make test-stdlib

      - name: Run error tests
        run: make test-errors

      - name: Run M-08 type tests
        run: make test-m08-types

      # Ambos pasos se saltan en el mirror público (scripts/sync_to_public.sh copia este
      # workflow tal cual, pero no scripts/sdd/ ni el cuarteto PROJECT_STATE/PLAN/TASKS).
      - name: Run docs health check
        if: hashFiles('PROJECT_STATE.md') != ''
        run: bash scripts/testing/run_docs_health.sh

      - name: Run SDD selftest
        if: hashFiles('scripts/sdd/selftest') != ''
        run: bash scripts/sdd/selftest
